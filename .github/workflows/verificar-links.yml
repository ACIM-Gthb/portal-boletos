name: Verificar links da página

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    name: verificar-links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir links permitidos e conteúdo proibido
        run: sh scripts/verificar-links.sh
